<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#fff1f5">
<meta name="color-scheme" content="light">
<meta name="description" content="Le compagnon qui fait progresser en lecture et en maths, du CP au CM2">
<meta name="caramel-version" content="2.4.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caramel">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Caramel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="fonts/fredoka-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/andika-400.woff2" as="font" type="font/woff2" crossorigin>
<script>
  /* Thème visuel du dernier profil, posé avant le premier affichage (sinon éclair des couleurs Caramel) ;
     main.js le confirme ensuite d'après le profil actif. Cache écrit par js/ui/theme-picker.js.
     Idem pour le réglage « animations douces » (html.motion-soft dès l'écran d'attente : le petit cheval ne saute
     pas) : cache 'caramel-motion' écrit par js/main.js. */
  (function () {
    try {
      if (localStorage.getItem('caramel-motion') === 'soft') document.documentElement.classList.add('motion-soft');
    } catch (e) {}
    try {
      var m = /^([a-z]{3,12})\|(#[0-9a-f]{6})$/.exec(localStorage.getItem('caramel-theme') || '');
      if (!m) return;
      document.documentElement.setAttribute('data-theme', m[1]);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', m[2]);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/motion.css">
<link rel="stylesheet" href="css/ui/kit.css">
<link rel="modulepreload" href="js/router.js">
<style>
  /* Coquille seulement : écran d'attente, bandeau de mise à jour, écrans de secours (le reste vit dans css/). */
  .boot { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 24px; text-align: center;
    color: var(--title, #b45309); font-weight: 600; font-size: 1.25rem; }
  .boot-horse { font-size: 4.5rem; line-height: 1; animation: boot-hop 1.2s var(--ease-pop, ease-in-out) infinite; }
  @keyframes boot-hop { 0%, 70%, 100% { transform: translateY(0); } 35% { transform: translateY(-14px) rotate(-6deg); } }
  .update-bar { position: sticky; top: 0; z-index: 90; display: block; width: 100%; min-height: 48px;
    padding: calc(12px + var(--safe-t, 0px)) calc(16px + var(--safe-r, 0px)) 12px calc(16px + var(--safe-l, 0px));
    background: var(--amber-200, #fde68a); color: var(--amber-900, #78350f); font-weight: 600; font-size: 1rem;
    line-height: 1.3; text-align: center; box-shadow: var(--shadow-2); }
  .update-bar[hidden] { display: none; }
  .update-bar:active { filter: brightness(.95); }
  .oops { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; text-align: center; }
  .oops-emoji { font-size: 4rem; line-height: 1; }
  .oops-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; margin-top: 10px; }
  .shell-msg { max-width: 460px; margin: 0 auto; padding: 48px 20px; text-align: center; font-size: 1.15rem;
    line-height: 1.5; color: #5b3a29; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  .shell-msg .big { font-size: 3.2rem; margin-bottom: 8px; }
  .shell-msg button { margin-top: 18px; min-height: 52px; padding: 12px 24px; border: none; border-radius: 999px;
    background: #fbbf24; color: #78350f; font: inherit; font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { .boot-horse { animation: none; } }
  html.motion-soft .boot-horse { animation: none; }
</style>
</head>
<body>
<main id="app">
  <div class="boot" role="status">
    <div class="boot-horse" aria-hidden="true">🐴</div>
    <p>Caramel arrive…</p>
  </div>
</main>
<noscript>
  <div class="shell-msg"><div class="big" aria-hidden="true">🐴</div>Caramel a besoin de JavaScript pour fonctionner. Active-le dans les réglages du navigateur, puis recharge la page.</div>
</noscript>
<script>
  /* Chien de garde (script classique, syntaxe ES5) : si le JavaScript moderne ne démarre pas
     (navigateur trop ancien, fichier introuvable, erreur de chargement), on l'explique avec douceur. */
  (function () {
    var shown = false;
    function fail(text) {
      if (window.__caramelBooted || shown) return;
      shown = true;
      var app = document.getElementById('app');
      if (!app) return;
      app.innerHTML = '<div class="shell-msg" role="alert"><div class="big" aria-hidden="true">🐴</div><p>' + text +
        '</p><button type="button" onclick="location.reload()">Réessayer 🔄</button></div>';
    }
    window.__caramelFail = fail;
    /* erreurs JavaScript, ou script introuvable (les autres ressources, CSS ou images, ne comptent pas) */
    window.addEventListener('error', function (e) {
      var t = e && e.target;
      var scriptFailed = t && t.tagName === 'SCRIPT';
      if (!scriptFailed && !(e && e.message)) return;
      fail('Caramel n’a pas pu démarrer sur ce navigateur. Recharge la page, ou essaie avec un navigateur à jour 😊');
    }, true);
    setTimeout(function () { fail('Caramel met du temps à arriver… Vérifie la connexion, puis réessaie.'); }, 20000);
  })();
</script>
<script nomodule>
  window.__caramelFail('Ce navigateur est un peu trop ancien pour Caramel. Mets-le à jour, ou essaie avec un navigateur récent (Chrome, Firefox, Safari) 😊');
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
