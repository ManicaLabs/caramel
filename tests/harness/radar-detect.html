  .rb-view { position: relative; background: repeating-conic-gradient(var(--pink-50) 0 25%, #fff 0 50%) 0 0 / 22px 22px;

  .rb-view canvas { display: block; width: 100%; height: auto; }

  .rb-out { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; background: #fff; border: 2px solid var(--amber-200);
    border-radius: var(--r-m); padding: 10px 12px; max-height: 60vh; overflow: auto; color: var(--ink); }
  .rb-ok { color: var(--ok-ink); font-weight: 700; } .rb-ko { color: var(--soft-ink); font-weight: 700; }
  .rb-table { width: 100%; border-collapse: collapse; font-size: .88rem; }

<body>
<!-- Banc d'essai de js/ui/radar-detect.js.
     1. Génère des FICHES SYNTHÉTIQUES au style des fiches Repères 2026 (maquettes DEPP), vérité terrain connue ;
     2. « Photo simulée » : rotation, échelle, perspective (maillage), éclairage inégal, ombre, flou, bruit, JPEG ;
     3. Analyse (fiche générée ou photo choisie) : superposition du résultat (cercles, axes, sommets lus) et écarts.
     Pilotage automatisé : window.radarBench = { ready, render(spec) → { url, truth }, photo(url, truth, opts) → { url, truth },
       detectURL(url, opts) → résultat, run(n, seed) → bilan } -->
<div class="rb">
  <div class="rb-head">

    </div>
  </div>
  <div class="card rb-panel">
    <div class="rb-row">
      <label>Classe <select id="classe"><option>CP</option><option>CE1</option><option>CE2</option><option>CM1</option><option selected>CM2</option></select></label>
      <label>Matière <select id="subject"><option value="fr">Français</option><option value="ma">Maths</option></select></label>
      <label>Graine <input id="seed" type="number" value="1" min="1"></label>
      <label>Style <select id="style"><option value="pdf">PDF</option><option value="print">Imprimé</option><option value="faded">Délavé</option><option value="mix" selected>Au hasard</option></select></label>
      <button type="button" class="btn small" id="gen">Nouvelle fiche</button>
    </div>
    <div class="rb-row">
      <label>Rotation <input id="rot" type="range" min="-25" max="25" value="6"></label>
      <label>Largeur du radar <input id="scale" type="range" min="25" max="95" value="60"></label>
      <label>Biais <input id="persp" type="range" min="0" max="10" value="4"></label>
      <label>Lumière <input id="light" type="range" min="0" max="10" value="5"></label>
      <label>Flou <input id="blur" type="range" min="0" max="10" value="3"></label>
      <button type="button" class="btn white small" id="sim">Photo simulée</button>
      <button type="button" class="btn small" id="detect">Analyser</button>
      <button type="button" class="btn white small" id="pick">Analyser une photo…</button>
      <input id="file" type="file" accept="image/*" hidden>
    </div>
  </div>
  <div class="rb-views">
    <div><div class="rb-view"><canvas id="src" width="10" height="10"></canvas></div><p class="rb-cap" id="srcCap">Image analysée</p></div>
    <div><div class="rb-view"><canvas id="rect" width="10" height="10"></canvas></div><p class="rb-cap">Radar redressé et lecture (pastille verte : sûr ; orange : à vérifier ; croix grise : vérité)</p></div>
  </div>
  <div class="rb-out" id="out">Prêt.</div>
</div>

<script type="module">
import { CLASSES, ficheTemplate } from './js/core/axes.js';
import { makeRng } from './js/core/rng.js';
import { detectRadar, rectify, projectPoint, RINGS } from './js/ui/radar-detect.js';

const $ = id => document.getElementById(id);
const TAU = Math.PI * 2, RAD = Math.PI / 180;

/* ============ COULEURS (relevées sur les maquettes 2026) ============ */
const PAL = {
  fr: { fills: ['#a9dee2', '#b9dee6', '#86d1d6', '#9fd6dc'], z1: '#d7ecef', z2: '#def0f2', z3: '#e9f4f6', halo: '#f4f9fa',
        arc: '#a7dce0', pict: '#b7dfe2', outline: '#4b5e6b', ray: '#8f9aa3', ring: '#6c7b86', light: '#d5edef' },
  ma: { fills: ['#ffc095', '#f8b280', '#fbb98a', '#ffc79f'], z1: '#fee8da', z2: '#feecde', z3: '#fef0e7', halo: '#fef5ee',
        arc: '#febe93', pict: '#fbc59c', outline: '#5a5552', ray: '#9b958f', ring: '#7a746f', light: '#fde3cf' }
};
const NAVY = '#2e3a63';
const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
const css = a => 'rgb(' + a.map(v => Math.max(0, Math.min(255, Math.round(v)))).join(',') + ')';
/* « impression » : désaturation, virage de teinte vers le gris-vert / le saumon, contraste */
function inkTransform(c, t) {
  let [r, g, b] = hex(c);
  const l = 0.3 * r + 0.59 * g + 0.11 * b;
  r = l + (r - l) * (1 - t.desat); g = l + (g - l) * (1 - t.desat); b = l + (b - l) * (1 - t.desat);
  r += t.shift[0]; g += t.shift[1]; b += t.shift[2];
  const k = t.gamma;
  return css([255 * Math.pow(r / 255, k), 255 * Math.pow(g / 255, k), 255 * Math.pow(b / 255, k)]);
}

/* ============ FICHE SYNTHÉTIQUE ============
   Mise en page relevée sur la maquette CM2 français (590 × 838) : centre (298 ; 375), R = 174,5.
   Cercles + / ++ / +++ à 0,5104 / 0,7553 / 1 R (mesuré), disque du cartable 0,19 R, halo jusqu'à 1,065 R,
   bande des familles 1,08 → 1,19 R, pictogrammes Ø 0,19 R centrés à 1,13 R, pastilles Ø 0,04 R. */
export function makeSpec(seed, over = {}) {
  const rng = makeRng('fiche-' + seed);
  const classe = over.classe || rng.pick(CLASSES);
  const subject = over.subject || rng.pick(['fr', 'ma']);
  const tpl = ficheTemplate(classe, subject);
  const n = tpl.axes.length;
  const nAbs = over.absent != null ? over.absent : rng.weighted([0, 1, 2, 3], [5, 3, 1.5, 0.5]);
  const absIdx = new Set(rng.sample([...Array(n).keys()], nAbs));
  const values = tpl.axes.map((a, i) => {
    if (absIdx.has(i)) return null;
    const u = rng.next();
    if (u < 0.22) return 3;
    if (u < 0.27) return rng.pick([1, 2]);
    return Math.round(rng.float(0.45, 2.98) * 100) / 100;
  });
  const style = over.style && over.style !== 'mix' ? over.style : rng.weighted(['pdf', 'print', 'faded'], [4, 4, 2]);
  const ink = style === 'pdf' ? { desat: rng.float(0, 0.12), shift: [0, 0, 0], gamma: rng.float(0.97, 1.03) }
    : style === 'print' ? { desat: rng.float(0.2, 0.5), shift: subject === 'fr' ? [rng.float(-6, 8), rng.float(-4, 4), rng.float(-14, -2)] : [rng.float(-4, 4), rng.float(-6, 6), rng.float(-10, 4)], gamma: rng.float(0.95, 1.12) }
    : { desat: rng.float(0.45, 0.75), shift: [rng.float(-6, 6), rng.float(-6, 6), rng.float(-8, 4)], gamma: rng.float(0.88, 1.0) };
  return {
    seed, classe, subject, values, style, ink,
    fill: rng.pick(PAL[subject].fills),
    lw: rng.float(0.85, 1.25),
    dot: rng.float(0.88, 1.15),
    name: rng.chance(0.5) ? 'Prénom de l’enfant' : Array.from({ length: 13 }, () => '0123456789abcdef'[rng.int(0, 15)]).join(''),
    textSeed: rng.int(1, 1e9),
    ...over
  };
}

function wrapWords(text, max) {
  const out = []; let line = '';
  for (const w of text.split(' ')) {
    if ((line + ' ' + w).trim().length > max && line) { out.push(line); line = w; } else line = (line + ' ' + w).trim();
  }
  if (line) out.push(line);
  return out;
}

/* dessine la page (largeur W px) → vérité terrain { cx, cy, R, values, angles } en px de la page */
export function drawFiche(ctx, W, spec) {
  const H = Math.round(W * 838 / 590);
  const u = W / 590;
  const rng = makeRng('txt-' + spec.textSeed);
  const P = PAL[spec.subject];
  const C = c => inkTransform(c, spec.ink);
  const tpl = ficheTemplate(spec.classe, spec.subject);
  const n = tpl.axes.length;
  const cx = 298 * u, cy = 375 * u, R = 174.5 * u;
  const lw = spec.lw;
  const pt = (ang, f) => [cx + f * R * Math.sin(ang * RAD), cy - f * R * Math.cos(ang * RAD)];
  ctx.save();
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const font = (px, w = 600, it = false) => (it ? 'italic ' : '') + w + ' ' + (px * u).toFixed(2) + 'px "Fredoka", "Segoe UI", system-ui, sans-serif';
  const text = (s, x, y, px, { w = 600, it = false, color = NAVY, align = 'left', base = 'alphabetic' } = {}) => {
    ctx.font = font(px, w, it); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(s, x * u, y * u);
  };
  const rrect = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x * u, y * u, w * u, h * u, r * u); };

  /* ---------- en-tête ---------- */
  ctx.fillStyle = '#1f4ea8'; ctx.fillRect(40 * u, 28 * u, 11 * u, 14 * u);
  ctx.fillStyle = '#e3373d'; ctx.fillRect(62 * u, 28 * u, 11 * u, 14 * u);
  text('MINISTÈRE', 40, 58, 11.5, { w: 700, color: '#111' });
  text('DE L’ÉDUCATION', 40, 70, 11.5, { w: 700, color: '#111' });
  text('NATIONALE', 40, 82, 11.5, { w: 700, color: '#111' });
  text('Liberté', 40, 94, 6.5, { it: true, color: '#111' }); text('Égalité', 40, 102, 6.5, { it: true, color: '#111' }); text('Fraternité', 40, 110, 6.5, { it: true, color: '#111' });
  /* deux enfants (formes simples) */
  for (const [x, skin, hair, shirt] of [[188, '#7a4b2a', '#2b1d14', '#3d8fd1'], [228, '#f2c9a5', '#9c3b2c', '#5eb26a']]) {
    ctx.fillStyle = shirt; rrect(x - 16, 72, 32, 40, 9); ctx.fill();
    ctx.fillStyle = hair; ctx.beginPath(); ctx.arc(x * u, 52 * u, 19 * u, 0, TAU); ctx.fill();
    ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(x * u, 56 * u, 15 * u, 0, TAU); ctx.fill();
    ctx.strokeStyle = NAVY; ctx.lineWidth = 1.6 * u;
    for (const d of [-6, 6]) { ctx.beginPath(); ctx.arc((x + d) * u, 55 * u, 4.5 * u, 0, TAU); ctx.stroke(); }
    ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.arc(x * u, 64 * u, 3 * u, 0, Math.PI); ctx.fill();
  }
  text('ÉVALUATION REPÈRES', 255, 58, 27, { w: 700 });
  ctx.fillStyle = C(P.light); rrect(255, 70, 95, 18, 2); ctx.fill();
  text(spec.name.length > 16 ? '6a56a6919da09' : spec.name, 302, 82, 7, { color: '#5c6a80', align: 'center', w: 500 });
  ctx.strokeStyle = C(P.arc); ctx.lineWidth = 2.2 * u; rrect(360, 70, 128, 24, 2); ctx.stroke();
  text(spec.subject === 'fr' ? 'FRANÇAIS' : 'MATHÉMATIQUES', 424, 87, 12.5, { w: 700, align: 'center' });
  ctx.fillStyle = NAVY; rrect(498, 70, 46, 24, 2); ctx.fill();
  text(spec.classe, 521, 88, 14, { w: 700, color: '#fff', align: 'center' });
  text('Fiche de restitution', 245, 119, 13.5, { w: 700 });
  ctx.strokeStyle = NAVY; ctx.lineWidth = 1.6 * u; ctx.beginPath(); ctx.moveTo(388 * u, 114 * u); ctx.lineTo(522 * u, 114 * u); ctx.stroke();
  CLASSES.forEach((c, i) => {
    ctx.beginPath(); ctx.arc((388 + i * 26.8) * u, 114 * u, 6 * u, 0, TAU);
    ctx.fillStyle = c === spec.classe ? NAVY : '#fff'; ctx.fill(); ctx.stroke();
  });
  text('Septembre 2026', 245, 140, 10, { it: true, w: 500, color: '#3b4a6b' });

  /* ---------- radar ---------- */
  const fill = C(spec.fill);
  /* halo et anneaux teintés */
  ctx.fillStyle = C(P.halo); ctx.beginPath(); ctx.arc(cx, cy, 1.065 * R, 0, TAU); ctx.fill();
  ctx.fillStyle = C(P.z3); ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
  ctx.fillStyle = C(P.z2); ctx.beginPath(); ctx.arc(cx, cy, RINGS[1] * R, 0, TAU); ctx.fill();
  ctx.fillStyle = C(P.z1); ctx.beginPath(); ctx.arc(cx, cy, RINGS[0] * R, 0, TAU); ctx.fill();
  /* bande des familles (un arc par rubrique, extrémités arrondies) */
  const groups = [];
  tpl.axes.forEach((a, i) => {
    const g = groups[groups.length - 1];
    if (g && g.domain === a.domain) g.to = a.angle; else groups.push({ domain: a.domain, from: a.angle, to: a.angle });
  });
  if (groups.length > 1 && groups[0].domain === groups[groups.length - 1].domain) { const last = groups.pop(); groups[0].from = last.from - 360; }
  const step = 360 / n;
  ctx.strokeStyle = C(P.arc); ctx.lineWidth = 0.105 * R; ctx.lineCap = 'round';
  const arcText = (label, midDeg, maxDeg) => {
    /* mot en lettres blanches le long de l'arc, centré sur midDeg, resserré pour tenir dans maxDeg */
    let px = 7.4;
    ctx.font = font(px, 700);
    let widths = [...label].map(ch => ctx.measureText(ch).width + 1.1 * u);
    let total = widths.reduce((s, w) => s + w, 0);
    const room = maxDeg * RAD * 1.135 * R;
    if (total > room) { const k = room / total; px *= Math.max(0.62, k); ctx.font = font(px, 700); widths = [...label].map(ch => ctx.measureText(ch).width + 1.1 * u * k); total = widths.reduce((s, w) => s + w, 0); }
    const flip = Math.cos(midDeg * RAD) < -0.2;
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    let acc = -total / 2;
    for (let k = 0; k < label.length; k++) {
      const off = (acc + widths[k] / 2) / (1.135 * R) / RAD * (flip ? -1 : 1);
      acc += widths[k];
      const ang = (midDeg + off) * RAD;
      ctx.save();
      ctx.translate(cx + 1.135 * R * Math.sin(ang), cy - 1.135 * R * Math.cos(ang));
      ctx.rotate(ang + (flip ? Math.PI : 0));
      ctx.fillText(label[k], 0, 0.2 * u);
      ctx.restore();
    }
  };
  const PICT = 5.6;     /* demi-largeur angulaire d'un pictogramme sur la bande (°) */
  for (const g of groups) {
    const d0 = g.from - step / 2 + 7, d1 = g.to + step / 2 - 7;
    ctx.strokeStyle = C(P.arc); ctx.lineWidth = 0.105 * R; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(cx, cy, 1.135 * R, d0 * RAD - Math.PI / 2, Math.max(d0 + 3, d1) * RAD - Math.PI / 2); ctx.stroke();
    /* intervalles libres entre les pictogrammes du groupe */
    const picts = [];
    for (let a = g.from; a <= g.to + 0.01; a += step) picts.push(a);
    const gaps = [];
    let cur = d0;
    for (const a of picts) { if (a - PICT - cur > 3) gaps.push([cur, a - PICT]); cur = a + PICT; }
    if (d1 - cur > 3) gaps.push([cur, d1]);
    const words = g.domain.split(' ');
    if (!gaps.length) continue;
    if (gaps.length >= words.length) {
      /* un mot par intervalle (les plus grands, dans l'ordre) */
      const chosen = gaps.map((gp, i) => ({ gp, i, len: gp[1] - gp[0] })).sort((x, y) => y.len - x.len).slice(0, words.length).sort((x, y) => x.i - y.i);
      chosen.forEach((c, i) => arcText(words[i], (c.gp[0] + c.gp[1]) / 2, c.gp[1] - c.gp[0] - 1.5));
    } else {
      const big = gaps.reduce((x, y) => (y[1] - y[0] > x[1] - x[0] ? y : x));
      arcText(g.domain, (big[0] + big[1]) / 2, big[1] - big[0] - 1.5);
    }
  }
  ctx.lineCap = 'round';
  /* polygone de l'élève (aplat) */
  const vtx = tpl.axes.map((a, i) => (spec.values[i] === null ? [cx, cy] : pt(a.angle, fracOf(spec.values[i]))));
  ctx.fillStyle = fill;
  ctx.beginPath(); vtx.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); ctx.fill();
  /* cercles pointillés */
  ctx.strokeStyle = C(P.ring); ctx.lineWidth = 1.05 * u * lw;
  [[RINGS[0], [4.2, 3.2]], [RINGS[1], [4.2, 3.2]], [1, [1.4, 2.2]]].forEach(([f, dash]) => {
    ctx.setLineDash(dash.map(d => d * u)); ctx.beginPath(); ctx.arc(cx, cy, f * R, 0, TAU); ctx.stroke();
  });
  ctx.setLineDash([]);
  /* axes (flèche au bout) ou mention d'absence le long de l'axe */
  tpl.axes.forEach((a, i) => {
    const [x0, y0] = pt(a.angle, 0.19), [x1, y1] = pt(a.angle, 1.05);
    if (spec.values[i] === null) {
      ctx.save();
      ctx.translate(...pt(a.angle, 0.6));
      const ang = (a.angle - 90) * RAD;
      const flip = Math.sin(a.angle * RAD) < 0;
      ctx.rotate(ang + (flip ? Math.PI : 0));
      text('Pas de positionnement : absence *', 0, 0, 7.6, { w: 500, color: '#4a5560', align: 'center', base: 'middle' });
      ctx.restore();
      return;
    }
    ctx.strokeStyle = C(P.ray); ctx.lineWidth = 1.25 * u * lw;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    const [ax, ay] = pt(a.angle, 1.075), s = Math.sin(a.angle * RAD), c = Math.cos(a.angle * RAD);
    ctx.fillStyle = C(P.ray); ctx.beginPath();
    ctx.moveTo(ax, ay); ctx.lineTo(x1 - 3 * u * c, y1 - 3 * u * s); ctx.lineTo(x1 + 3 * u * c, y1 + 3 * u * s); ctx.closePath(); ctx.fill();
  });
  /* contour du polygone puis pastilles blanches cerclées */
  ctx.strokeStyle = C(P.outline); ctx.lineWidth = 1.55 * u * lw;
  ctx.beginPath(); vtx.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); ctx.stroke();
  vtx.forEach(([x, y], i) => {
    if (spec.values[i] === null) return;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = C(P.outline); ctx.lineWidth = 1.3 * u * lw;
    ctx.beginPath(); ctx.arc(x, y, 3.3 * u * spec.dot, 0, TAU); ctx.fill(); ctx.stroke();
  });
  /* repères ⊕ sur l'axe vertical : 1 sur +, 2 sur ++, 3 sur +++ */
  const glyph = (x, y) => {
    ctx.fillStyle = NAVY; ctx.beginPath(); ctx.arc(x, y, 4.1 * u, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.3 * u; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(x - 2.3 * u, y); ctx.lineTo(x + 2.3 * u, y); ctx.moveTo(x, y - 2.3 * u); ctx.lineTo(x, y + 2.3 * u); ctx.stroke();
    ctx.lineCap = 'round';
  };
  glyph(cx, cy - RINGS[0] * R);
  for (const d of [-7.1, 7.1]) glyph(cx + d * u, cy - RINGS[1] * R);
  for (const d of [-14.2, 0, 14.2]) glyph(cx + d * u, cy - R);
  /* disque du cartable (pointillé), cartable, étiquette du prénom */
  ctx.fillStyle = C(P.z1); ctx.beginPath(); ctx.arc(cx, cy, 0.19 * R, 0, TAU); ctx.fill();
  ctx.strokeStyle = C(P.ring); ctx.lineWidth = 1 * u; ctx.setLineDash([3 * u, 2.5 * u]);
  ctx.beginPath(); ctx.arc(cx, cy, 0.19 * R, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
  const bx = cx - 0.11 * R, by = cy - 0.15 * R, bw = 0.2 * R, bh = 0.25 * R;

    r.axes.forEach((ax, i) => {
      const a = ax.angle * RAD;
      x.strokeStyle = 'rgba(157,23,77,.5)'; x.beginPath(); x.moveTo(c0, c0); x.lineTo(c0 + 1.05 * Rr * Math.sin(a), c0 - 1.05 * Rr * Math.cos(a)); x.stroke();
      if (truth && truth.values && truth.values[i] !== undefined) {
        const tv = truth.values[i];
        const f = tv === null ? 0 : fracOf(tv);
        const px = c0 + f * Rr * Math.sin(a), py = c0 - f * Rr * Math.cos(a);
        x.strokeStyle = '#555'; x.lineWidth = 2; x.beginPath(); x.moveTo(px - 6, py - 6); x.lineTo(px + 6, py + 6); x.moveTo(px + 6, py - 6); x.lineTo(px - 6, py + 6); x.stroke();
      }
      if (ax.theta !== null) {
        const px = c0 + ax.r * Rr * Math.sin(a), py = c0 - ax.r * Rr * Math.cos(a);
        x.fillStyle = ax.confidence >= 0.6 ? 'rgba(22,163,74,.85)' : 'rgba(245,158,11,.9)';
        x.beginPath(); x.arc(px, py, 5, 0, TAU); x.fill();
      }
    });
  } else { rc.width = 10; rc.height = 10; }
  const lines = [];
  lines.push((r.ok ? '✓ trouvé' : '✗ non trouvé') + ' · confiance ' + (r.confidence || 0).toFixed(2) + ' · ' + r.ms.toFixed(0) + ' ms · matière ' + (r.subject || '?') +
    ' (couleur du radar : ' + (r.subjectColor || '?') + ')' + (r.reason ? ' · ' + r.reason : '') + (r.hint ? ' · conseil : ' + r.hint : ''));
  if (r.debug && r.debug.stats) lines.push('contrôles : axes retrouvés ' + Math.round(100 * r.debug.stats.ray) + ' % · cercles ' + Math.round(100 * r.debug.stats.ring) + ' % · haut ' + (r.debug.up || '?') +
    ' · repères ⊕ ' + (r.debug.nGlyphs != null ? r.debug.nGlyphs + '/6' : '?'));
  if (r.center) lines.push('centre ' + r.center.x.toFixed(1) + ', ' + r.center.y.toFixed(1) + ' · R ' + r.R.toFixed(1) + ' · rotation ' + r.rotation.toFixed(1) + '°');
  if (truth && truth.cx && r.center) {
    const s = r.scale || 1;
    lines.push('vérité : centre ' + (truth.cx * s).toFixed(1) + ', ' + (truth.cy * s).toFixed(1) + ' · R ' + (truth.R * s).toFixed(1) + ' · rotation ' + (truth.rotation || 0).toFixed(1) + '°' +
      ' → écart centre ' + (100 * Math.hypot(r.center.x - truth.cx * s, r.center.y - truth.cy * s) / (truth.R * s)).toFixed(1) + ' % R, R ' + (100 * (r.R / (truth.R * s) - 1)).toFixed(1) + ' %');
  }
  (r.axes || []).forEach((ax, i) => {
    const tv = truth && truth.values ? truth.values[i] : undefined;
    lines.push(String(i + 1).padStart(2) + '. ' + (ax.theta === null ? 'absent' : ax.theta.toFixed(1)).padEnd(7) + ' conf ' + ax.confidence.toFixed(2) +
      (tv !== undefined ? '   vérité ' + (tv === null ? 'absent' : tv.toFixed(2)) + (tv !== null && ax.theta !== null ? '  Δ ' + (ax.theta - tv).toFixed(2) : '') : ''));
  });
  $('out').textContent = lines.join('\n');
  return r;
}

$('gen').addEventListener('click', () => generate());
$('sim').addEventListener('click', () => simulate());
$('detect').addEventListener('click', async () => { if (!cur) await generate(); analyse(cur.url, cur.photoTruth); });
$('pick').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const url = URL.createObjectURL(f);
  cur = null;
  await show(url, null);
  analyse(url, null);
});

/* pilotage automatisé (puppeteer) */
window.radarBench = {
  ready: true,
  async render(specOver = {}, width = 1180) {
    try { await document.fonts.load('600 20px "Fredoka"'); } catch (_) {}
    const spec = makeSpec(specOver.seed || 1, specOver);
    const page = document.createElement('canvas'); page.width = width; page.height = Math.round(width * 838 / 590);
    const truth = drawFiche(page.getContext('2d'), width, spec);
    window.__lastPage = page;
    return { url: page.toDataURL('image/png'), truth: { ...truth, W: page.width, Hp: page.height, rotation: 0, spec } };
  },
  async photo(o = {}) {
    const page = window.__lastPage;
    const { truth } = o;
    return simulatePhoto(page, truth, o);
  },
  detectURL,
  async analyse(url, truth) { return analyse(url, truth); }
};
generate();
</script>
